name: Validate translator
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          DASHSCOPE_API_KEY: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t translatorhelper:ci .
      - name: Verify production document dependencies
        run: >-
          docker run --rm --entrypoint python translatorhelper:ci -c
          "import shutil; import pymupdf; from backend.app.main import app; from backend.app.services.office_engine import office_binary; assert shutil.which('tesseract'); assert office_binary(); doc=pymupdf.open(); page=doc.new_page(); assert page.insert_htmlbox(pymupdf.Rect(20,20,300,100),'中文排版验证')[0]>=0; print('Production image dependencies and CJK rendering: OK')"
