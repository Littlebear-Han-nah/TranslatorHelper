services:
  - type: web
    name: translatorhelper-v2
    runtime: docker
    plan: 1c-2g
    branch: main
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://ws-z35kkg3gacz2xk3g.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - key: DEFAULT_MODEL
        value: qwen3.7-flash
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: MAX_PAGES
        value: '200'
    disk:
      name: translator-documents
      mountPath: /app/data
      sizeGB: 5
